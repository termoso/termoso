# Flathub manifest for the desktop app. Builds from the release source
# tarball with vendored crates and npm packages (generated by
# flatpak-cargo-generator / flatpak-node-generator at submission time).
app-id: com.termoso.Termoso
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: termoso
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all           # USB serial consoles
  - --filesystem=home      # SFTP browsing and key files
  - --talk-name=org.freedesktop.secrets
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/termoso/cargo
modules:
  - name: termoso
    buildsystem: simple
    build-options:
      env:
        CARGO_NET_OFFLINE: "true"
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cd apps/desktop && npm ci --offline && npm run build
      - cargo --offline build --release -p termoso-desktop
      - install -Dm755 target/release/termoso-desktop /app/bin/termoso
      - install -Dm644 packaging/flatpak/com.termoso.Termoso.desktop /app/share/applications/com.termoso.Termoso.desktop
      - install -Dm644 packaging/flatpak/com.termoso.Termoso.metainfo.xml /app/share/metainfo/com.termoso.Termoso.metainfo.xml
      - install -Dm644 apps/desktop/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.termoso.Termoso.png
      - install -Dm644 apps/desktop/src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.termoso.Termoso.png
    sources:
      - type: archive
        url: https://github.com/termoso/termoso/archive/refs/tags/v0.11.3.tar.gz
        sha256: REPLACE_WITH_RELEASE_TARBALL_SHA256
      - cargo-sources.json
      - node-sources.json
