# F-Droid metadata (fdroiddata/metadata/com.termoso.android.yml). F-Droid
# builds the Rust core with cargo-ndk inside its own builder, so the recipe
# mirrors the android job of .github/workflows/release.yml.
Categories:
  - Connectivity
  - System
License: AGPL-3.0-or-later
AuthorName: Termoso
WebSite: https://termoso.dev
SourceCode: https://github.com/termoso/termoso
IssueTracker: https://github.com/termoso/termoso/issues
Changelog: https://github.com/termoso/termoso/releases

AutoName: Termoso
Summary: SSH, SFTP and terminal client with an encrypted vault
Description: |-
  Termoso keeps hosts, keys and snippets in a vault encrypted on your device,
  syncs them to your own server (or none at all), and gives you a terminal with
  a key panel and gestures, SFTP, port forwarding, Mosh, Telnet and USB serial
  consoles. Teams get shared vaults, SSO, audit and session recordings on a
  self-hosted server.

RepoType: git
Repo: https://github.com/termoso/termoso

Builds:
  - versionName: 0.11.3
    versionCode: 11003
    commit: v0.11.3
    subdir: apps/android/app
    gradle:
      - yes
    gradleprops:
      - termoso.abis=arm64-v8a,armeabi-v7a,x86_64
    sudo:
      - apt-get update
      - apt-get install -y curl build-essential
      - curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - . $HOME/.cargo/env && rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - . $HOME/.cargo/env && cargo install cargo-ndk --version 4.1.2 --locked
    ndk: r28
    scandelete:
      - apps/desktop
      - apps/ios
      - web

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.11.3
CurrentVersionCode: 11003
