apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "termoso.fullname" . }}-config
  labels:
    {{- include "termoso.labels" . | nindent 4 }}
data:
  TERMOSO_BIND: "0.0.0.0:8080"
  TERMOSO_S3__BUCKET: {{ .Values.s3.bucket | quote }}
  TERMOSO_S3__REGION: {{ .Values.s3.region | quote }}
  {{- if .Values.bundled.rustfs.enabled }}
  TERMOSO_S3__ENDPOINT: {{ printf "http://%s-rustfs:9000" (include "termoso.fullname" .) | quote }}
  {{- else if .Values.s3.endpoint }}
  TERMOSO_S3__ENDPOINT: {{ .Values.s3.endpoint | quote }}
  {{- end }}
  {{- if .Values.metrics.enabled }}
  TERMOSO_METRICS__ENABLED: "true"
  TERMOSO_METRICS__BIND: {{ printf "0.0.0.0:%d" (int .Values.metrics.port) | quote }}
  {{- end }}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
