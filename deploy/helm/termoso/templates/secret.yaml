{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "termoso.secretName" . }}
  labels:
    {{- include "termoso.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.secrets.TERMOSO_MASTER_KEY }}
  {{- fail "secrets.TERMOSO_MASTER_KEY is required (openssl rand -base64 32)" }}
  {{- end }}
  {{- range $k, $v := .Values.secrets }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- if and (not .Values.database.existingSecret) (include "termoso.databaseUrl" .) }}
  TERMOSO_DATABASE_URL: {{ include "termoso.databaseUrl" . | quote }}
  {{- end }}
  {{- if and (not .Values.redis.existingSecret) (include "termoso.redisUrl" .) }}
  TERMOSO_REDIS_URL: {{ include "termoso.redisUrl" . | quote }}
  {{- end }}
  {{- if .Values.bundled.rustfs.enabled }}
  TERMOSO_S3__ACCESS_KEY: {{ .Values.bundled.rustfs.accessKey | quote }}
  TERMOSO_S3__SECRET_KEY: {{ .Values.bundled.rustfs.secretKey | quote }}
  {{- else if not .Values.s3.existingSecret }}
  TERMOSO_S3__ACCESS_KEY: {{ .Values.s3.accessKey | quote }}
  TERMOSO_S3__SECRET_KEY: {{ .Values.s3.secretKey | quote }}
  {{- end }}
{{- end }}
