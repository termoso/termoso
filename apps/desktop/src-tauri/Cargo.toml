[package]
name = "termoso-desktop"
description = "Termoso desktop client (Tauri 2 shell over termoso-core)"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "termoso_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
termoso-core = { path = "../../../crates/termoso-core" }
termoso-client = { workspace = true, features = ["fido2"] }
termoso-crypto = { workspace = true }
termoso-proto = { workspace = true }

tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-deep-link = "2.6"
tauri-plugin-notification = "2.7"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }

tokio = { workspace = true }
tokio-util = { version = "0.7" }
serde = { workspace = true }
serde_json = { workspace = true }
plist = "1"
toml = "0.8"
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
hostname = "0.4"
url = { workspace = true }
time = { version = "0.3", features = ["formatting"] }
tauri-plugin-updater = "2.14"
dunce = "1"
notify = "8"
similar = "2"
zmodem2 = "0.7"

[dev-dependencies]
tempfile = "3"
axum = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
] }
