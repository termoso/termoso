[package]
name = "termoso-core"
description = "Termoso client core: encrypted local vault, sync, SSH/SFTP/PTY engines shared by desktop and mobile"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
totp-rs = { workspace = true }
termoso-crypto = { workspace = true }
termoso-proto = { workspace = true }

tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
futures = { workspace = true }
async-trait = "0.1"

# local storage
rusqlite = { version = "0.39", features = ["bundled"] }
keyring = { version = "4", optional = true }

# ssh / sftp / terminals
russh = { version = "0.65", features = ["rsa"] }
russh-sftp = "3"
portable-pty = { version = "0.9", optional = true }
serialport = { version = "4.9", default-features = false, optional = true }
encoding_rs = { version = "0.8" }
rand = "0.10"
# FIDO2 security keys: desktop USB HID backend…
ctap-hid-fido2 = { version = "3.5", optional = true }
# …and our own CTAP2 client (CBOR, PIN protocols 1/2) for transports the
# platform hands us (Android USB host / NFC).
ciborium = { version = "0.2", optional = true }
p256 = { version = "0.13", optional = true, features = ["ecdh"] }
aes = { version = "0.8" }
# Mosh OCB3 (ocb3 0.2 is on cipher 0.5); the FIDO2 CBC path still uses aes 0.8 through cbc 0.1.
aes9 = { package = "aes", version = "0.9" }
cbc = { version = "0.1", optional = true }
# Mosh: AES-128-OCB3 datagrams + zlib-compressed instructions.
ocb3 = { version = "0.2", default-features = false }
flate2 = "1"
hkdf = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
# Software authenticator for tests (feature `fido2-soft`).
ed25519-dalek = { version = "2", optional = true }

# server api
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
# WebDAV: pinned self-signed certificates need our own verifier; Digest auth
# still means MD5 on most servers.
rustls = { version = "0.23.27", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
md5 = "0.8"
percent-encoding = "2"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
hex = "0.4"
sha2 = { workspace = true }
hmac = "0.12"
quick-xml = "0.41"
dirs = "7"
# Local-network discovery (`_ssh._tcp` / `_sftp-ssh._tcp` over mDNS).
mdns-sd = { version = "0.21", default-features = false, features = ["async"] }

[features]
default = ["keychain", "local-pty", "serial", "fido2", "fido2-ctap"]
# Store the local master key in the OS keychain (Secret Service / Credential Manager / Keychain).
keychain = ["dep:keyring"]
# Local terminal (spawns the user's shell in a PTY).
local-pty = ["dep:portable-pty"]
# Serial console over a COM / tty device.
serial = ["dep:serialport"]
# FIDO2 security keys (`sk-ssh-ed25519@openssh.com`, `sk-ecdsa-sha2-nistp256@openssh.com`).
fido2 = ["dep:ctap-hid-fido2"]
# Transport-agnostic CTAP2 client (`fido2::ctap`, `fido2::hid`, `fido2::nfc`).
fido2-ctap = ["dep:ciborium", "dep:p256", "dep:cbc", "dep:hkdf", "dep:rand_core"]
# In-memory CTAP2 authenticator (`fido2::soft`) – test double, not for production.
fido2-soft = ["fido2-ctap", "dep:ed25519-dalek"]

[dev-dependencies]
termoso-core = { path = ".", features = ["fido2-soft"] }
tempfile = "3"
# In-process WebDAV server for the client tests (plain, Basic/Digest, TLS).
dav-server = { version = "0.11", default-features = false, features = ["memfs"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { workspace = true, features = ["test-util"] }
termoso-server = { path = "../termoso-server" }
axum = { workspace = true }
sqlx = { workspace = true }
anyhow = { workspace = true }
