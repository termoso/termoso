name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: tests (postgres + redis + rustfs + mailpit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: termoso
          POSTGRES_PASSWORD: termoso
          POSTGRES_DB: termoso
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U termoso -d termoso"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TERMOSO_TEST_DATABASE_URL: postgres://termoso:termoso@localhost:5432/termoso
      TERMOSO_TEST_REDIS_URL: redis://127.0.0.1:6379
      TERMOSO_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TERMOSO_TEST_SMTP_ADDR: 127.0.0.1:1025
      TERMOSO_TEST_MAILPIT_URL: http://127.0.0.1:8025
      TERMOSO_TEST_REQUIRE_SERVICES: "1"
      TERMOSO_TEST_REQUIRE_MOSH: "1"
      # backup/restore round trip needs pg_dump of the server's major version.
      TERMOSO_TEST_PG_DUMP: /usr/lib/postgresql/18/bin/pg_dump
      TERMOSO_TEST_PG_RESTORE: /usr/lib/postgresql/18/bin/pg_restore
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk (cargo test --workspace fills the 14 GB root volume)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - name: Tauri system libraries + mosh-server (Mosh interop tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev mosh
      - name: PostgreSQL 18 client (pg_dump/pg_restore for the backup tests)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
      - name: Start RustFS (S3-compatible storage for session-log tests)
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=minioadmin -e RUSTFS_SECRET_KEY=minioadmin \
            rustfs/rustfs:1.0.0
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/health && break
            sleep 1
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - if: always()
        run: df -h / target

  web:
    name: web cabinet (wasm + typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run wasm
      - run: npm run format:check
      - run: node ../scripts/i18n-extract.mjs --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  desktop:
    name: desktop webview (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Everything else runs on Linux, so this is what catches a broken
  # `cfg(target_os = "macos")` branch or a bundle setting the macOS bundler
  # rejects. The debug .app is ad-hoc signed exactly like a release without
  # Apple secrets (docs/RELEASING.md), then actually launched: the runner has
  # a GUI session, so apps/desktop/smoke drives welcome → hosts → local zsh →
  # settings inside the real WKWebView and screenshots the window.
  macos:
    name: macos (clippy + core tests + tauri build --debug + runtime smoke)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/desktop
      - run: cargo clippy -p termoso-core -p termoso-desktop --all-targets --locked
      - run: cargo test -p termoso-core --locked
      # No updater key on CI: build the .app only, skip the signed updater tarball.
      - run: npm run tauri build -- --debug --bundles app --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'
        working-directory: apps/desktop
      - name: Inspect the bundle
        run: |
          app=target/debug/bundle/macos/Termoso.app
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          test -x "$exe" || { echo "::error::no executable at $exe"; ls -R "$app"; exit 1; }
          plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|LSMinimumSystemVersion|CFBundleURLSchemes'
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|TeamIdentifier|Signature)'
          lipo -info "$exe"
      - name: Runtime smoke
        run: apps/desktop/smoke/macos.sh target/debug/bundle/macos/Termoso.app "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-smoke
          path: |
            ${{ runner.temp }}/smoke/*.png
            ${{ runner.temp }}/smoke/report.txt
            ${{ runner.temp }}/smoke/app.log
          if-no-files-found: ignore
          retention-days: 14

  # SwiftUI client over the same Rust core (UniFFI Swift). The simulator slice
  # is enough to compile, run XCTest against the real core and drive the UI
  # smoke (XCUITest) — screenshots and the .xcresult are uploaded.
  ios:
    name: ios (rust sim core + uniffi swift + xcodebuild + XCTest/XCUITest)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - run: brew install xcodegen
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - run: xcodebuild -version && xcodegen --version
      - name: Rust core (simulator) + Swift bindings + xcframework
        run: ./build-core.sh --debug --sim --no-device
        working-directory: apps/ios
      - run: xcodegen generate
        working-directory: apps/ios
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          picks=[(rt,dev) for rt,devs in d.items() if "iOS" in rt for dev in devs if dev["name"].startswith("iPhone")]
          picks.sort(key=lambda p:(p[0],p[1]["name"]))
          print(picks[-1][1]["udid"])')
          xcrun simctl boot "$udid" || true
          xcrun simctl list devices | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Termoso.xcodeproj -scheme Termoso \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" | tee "$RUNNER_TEMP/build.log" | grep -E 'error:|warning:|\*\*' || true
          grep -q '\*\* TEST BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/build.log"
        working-directory: apps/ios
      - name: XCTest + XCUITest (simulator)
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Termoso.xcodeproj -scheme Termoso \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/Termoso.xcresult" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            | tee "$RUNNER_TEMP/test.log" | grep -E 'Test Case|Test Suite|error|failed|passed|\*\*' || true
          grep -q '\*\* TEST EXECUTE SUCCEEDED \*\*' "$RUNNER_TEMP/test.log"
        working-directory: apps/ios
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/screens"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Termoso.xcresult" --output-path "$RUNNER_TEMP/screens" || true
          ls -la "$RUNNER_TEMP/screens" || true
          # Give the PNGs their test-assigned names when the manifest is present.
          python3 - "$RUNNER_TEMP/screens" <<'EOF' || true
          import json, os, sys
          d = sys.argv[1]
          m = os.path.join(d, "manifest.json")
          if os.path.exists(m):
              for entry in json.load(open(m)):
                  for a in entry.get("attachments", []):
                      src = os.path.join(d, a["exportedFileName"])
                      dst = os.path.join(d, a.get("suggestedHumanReadableName") or a["exportedFileName"])
                      if os.path.exists(src) and src != dst:
                          os.replace(src, dst)
          EOF
          (cd "$RUNNER_TEMP" && zip -qr Termoso.xcresult.zip Termoso.xcresult) || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator
          path: |
            ${{ runner.temp }}/screens/*.png
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/Termoso.xcresult.zip
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: android (cargo-ndk + gradle assembleDebug + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-ndk@4.1.2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Rust for one ABI is enough to compile, lint and generate the bindings.
      - run: ./gradlew --no-daemon -Ptermoso.abis=arm64-v8a :app:assembleDebug :app:lint
        working-directory: apps/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
      - uses: actions/upload-artifact@v7
        with:
          name: termoso-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # Supply chain: RustSec advisories, license allow-list, banned crates and
  # registry sources for the whole workspace (deny.toml), plus the npm
  # advisory database for both JS trees. Gradle is covered by the dependency
  # graph submitted from dependency-graph.yml (Dependabot alerts).
  supply-chain:
    name: supply chain (cargo deny + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories bans licenses sources
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --audit-level=moderate
        working-directory: web
      - run: npm audit --audit-level=moderate
        working-directory: apps/desktop

  # Untrusted-input parsers (SAML, WebDAV, terminal, key import, deep links)
  # must keep compiling against the crates they cover; a short run of each
  # target catches shallow panics early. Long campaigns are run by hand.
  fuzz:
    name: fuzz targets (nightly check + smoke)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
      FUZZ_TOOLCHAIN: nightly-2026-10-31
      # The prebuilt cargo-fuzz binary is musl-static and defaults to its own
      # build triple; pin the target so the targets link against the host glibc std.
      FUZZ_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev
      # Pinned: the 2026-11-01 nightly fails on zvariant_utils (E0391 async-drop cycle);
      # move the date forward once rustc is fixed.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo +${{ env.FUZZ_TOOLCHAIN }} fuzz check --target "$FUZZ_TARGET"
        working-directory: fuzz
      - run: cargo +${{ env.FUZZ_TOOLCHAIN }} run --example seed
        working-directory: fuzz
      - name: smoke each target
        working-directory: fuzz
        run: |
          for t in $(cargo +${{ env.FUZZ_TOOLCHAIN }} fuzz list); do
            cargo +${{ env.FUZZ_TOOLCHAIN }} fuzz run --target "$FUZZ_TARGET" "$t" -- -max_total_time=20 -max_len=16384 -timeout=10 -rss_limit_mb=2048
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  # Both images are built natively per architecture (no QEMU: a Rust release
  # build under emulation takes hours) and pushed by digest; docker-publish
  # then joins the two digests into one multi-arch manifest per tag.
  docker:
    name: docker image (${{ matrix.image }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [check, test, web]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, bridge, backup]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/termoso-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile${{ matrix.image != 'server' && format('.{0}', matrix.image) || '' }}
          platforms: linux/${{ matrix.arch }}
          # Pull requests only build; pushes upload the image untagged, by
          # digest, for docker-publish to assemble.
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.image.outputs.name) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: docker manifest (${{ matrix.image }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, bridge, backup]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/termoso-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/termoso-${{ matrix.image }}"
          ls
          [ "$(ls | wc -l)" -eq 2 ] || { echo "::error::expected 2 digests (amd64 + arm64)"; exit 1; }
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$image@sha256:%s " *)
      - name: Verify the manifest
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/termoso-${{ matrix.image }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$image"
          for p in linux/amd64 linux/arm64; do
            docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' \
              | jq -e --arg p "$p" '.manifests[] | select((.platform.os + "/" + .platform.architecture) == $p)' > /dev/null \
              || { echo "::error::$image lacks $p"; exit 1; }
          done
