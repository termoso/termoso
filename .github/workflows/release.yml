name: Desktop release

# Builds signed desktop bundles, signed Android APKs and the unsigned iOS
# .ipa (sideload: signed on the user's side by AltStore/SideStore, see
# docs/IOS_SIDELOAD.md) with its AltStore source `termoso-altstore.json`.
# On a `v*` tag it assembles a draft GitHub release with the installers, their
# minisign `.sig` files and the updater manifest `latest.json`, then adds
# SHA256SUMS and publishes it once every asset is in place (so
# `releases/latest` never points at a half-uploaded release). Run manually
# (workflow_dispatch) or on a pull request touching packaging, it only uploads
# the bundles as workflow artifacts, so the pipeline can be exercised without
# publishing.
#
# Required repository secrets (see docs/RELEASING.md):
#   TAURI_SIGNING_PRIVATE_KEY           minisign private key (from `tauri signer generate`)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   ANDROID_KEYSTORE_BASE64             release keystore (`base64 -w0 termoso-release.jks`)
#   ANDROID_KEYSTORE_PASSWORD           its store/key password (alias `termoso`)
# Optional (macOS Developer ID signing + notarization; without them the .app is
# ad-hoc signed and users open it with `xattr -cr`, see docs/RELEASING.md):
#   APPLE_CERTIFICATE                   Developer ID Application .p12, base64
#   APPLE_CERTIFICATE_PASSWORD          its password
#   APPLE_SIGNING_IDENTITY              "Developer ID Application: Name (TEAMID)"
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID   notarytool credentials (app-specific password)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/tauri.macos.conf.json
      - apps/desktop/src-tauri/capabilities/**
      - apps/desktop/src-tauri/icons/**
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/package.json
      - apps/android/app/build.gradle.kts
      - apps/android/gradle.properties
      - apps/ios/project.yml
      - apps/ios/build-core.sh
      - apps/ios/altstore/**

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  version:
    name: version consistency
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        run: |
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          ws=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "package.json=$pkg workspace=$ws ref=$GITHUB_REF_NAME"
          [ "$pkg" = "$ws" ] || { echo "::error::apps/desktop/package.json and Cargo.toml versions differ"; exit 1; }
          ios=$(sed -n 's/^    MARKETING_VERSION: "\(.*\)"/\1/p' apps/ios/project.yml | head -1)
          [ "$ios" = "$ws" ] || { echo "::error::apps/ios/project.yml MARKETING_VERSION ($ios) differs from Cargo.toml ($ws)"; exit 1; }
          # Store manifests and the Helm chart carry the version too.
          chart=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' deploy/helm/termoso/Chart.yaml)
          snap=$(sed -n 's/^version: "\(.*\)"/\1/p' packaging/snap/snapcraft.yaml)
          scoop=$(node -p "require('./packaging/scoop/termoso.json').version")
          fdroid=$(sed -n 's/^CurrentVersion: \(.*\)/\1/p' packaging/fdroid/com.termoso.android.yml)
          flatpak=$(sed -n 's|.*/archive/refs/tags/v\(.*\)\.tar\.gz|\1|p' packaging/flatpak/com.termoso.Termoso.yml)
          for pair in "deploy/helm/termoso/Chart.yaml=$chart" "packaging/snap/snapcraft.yaml=$snap" "packaging/scoop/termoso.json=$scoop" "packaging/fdroid/com.termoso.android.yml=$fdroid" "packaging/flatpak/com.termoso.Termoso.yml=$flatpak"; do
            [ "${pair#*=}" = "$ws" ] || { echo "::error::${pair%%=*} carries version ${pair#*=}, Cargo.toml has $ws"; exit 1; }
          done
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$pkg" ] || { echo "::error::tag $GITHUB_REF_NAME does not match version $pkg"; exit 1; }
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
      # One draft per tag, created here before the platform matrix fans out.
      # Letting every bundle job create it on demand raced on v0.11.1: two
      # drafts appeared in the same second and the assets were split between them.
      - name: Create the draft release
        id: draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="Termoso $GITHUB_REF_NAME" \
              -F draft=true -F prerelease=${{ contains(github.ref_name, '-') }} \
              -f body="Signed desktop builds of Termoso ${{ steps.v.outputs.version }}." --jq .id)
          fi
          echo "draft release id=$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  bundle:
    name: ${{ matrix.name }}
    needs: version
    # Dependabot PRs do not see repository secrets, so the signing step would
    # fail on an empty key; the CI workflow still builds the desktop there.
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86_64 (deb, rpm, AppImage)
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: linux-x86_64
          - name: linux aarch64 (deb, rpm, AppImage)
            os: ubuntu-22.04-arm
            bundles: deb,rpm,appimage
            artifact: linux-aarch64
          - name: windows x86_64 (msi, nsis)
            os: windows-latest
            bundles: msi,nsis
            artifact: windows-x86_64
          # Cross-compiled on the x86_64 runner: the MSVC toolchain targets
          # ARM64 natively and both WiX and NSIS produce arm64 installers.
          - name: windows aarch64 (msi, nsis)
            os: windows-latest
            bundles: msi,nsis
            target: aarch64-pc-windows-msvc
            artifact: windows-aarch64
          # Two separate dmgs (Apple Silicon + Intel) rather than one universal
          # binary: half the download, and the updater picks the right one.
          - name: macos (dmg, Apple Silicon)
            os: macos-latest
            bundles: app,dmg
            target: aarch64-apple-darwin
            artifact: macos-aarch64
          - name: macos (dmg, Intel)
            os: macos-latest
            bundles: app,dmg
            target: x86_64-apple-darwin
            artifact: macos-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev libudev-dev libssl-dev patchelf file xdg-utils

      # Pre-seeds ~/.cache/tauri with Termoso's linuxdeploy `appimage` output
      # plugin, which strips the bundled libwayland before packing.
      - name: Termoso linuxdeploy appimage plugin
        if: runner.os == 'Linux'
        run: apps/desktop/src-tauri/appimage/prepare.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.artifact }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/desktop

      # Tauri reads the APPLE_* variables only when they are set, and an empty
      # APPLE_SIGNING_IDENTITY would override the ad-hoc identity from
      # tauri.macos.conf.json, so export them only when the secrets exist.
      - name: Apple signing credentials (when configured)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export_env() {
            # heredoc form: a base64 .p12 may span several lines
            for v in "$@"; do
              printf '%s<<__TERMOSO_EOF__\n%s\n__TERMOSO_EOF__\n' "$v" "${!v}" >> "$GITHUB_ENV"
            done
          }
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            export_env APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              export_env APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
              echo "Developer ID signing + notarization"
            else
              echo "Developer ID signing, no notarization"
            fi
          else
            echo "No Apple certificate: ad-hoc signature (users run xattr -cr once)"
          fi

      - name: Build, sign and (on tags) publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          # Only publish from a tag; a manual run just produces artifacts below.
          releaseId: ${{ github.ref_type == 'tag' && needs.version.outputs.release_id || '' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Termoso {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseBody: |
            Signed desktop builds of Termoso ${{ needs.version.outputs.version }}.

            Every installer ships with a minisign `.sig`; the app verifies it against the
            public key compiled into the binary before installing an update. `latest.json`
            is the updater manifest — mirror it (and the assets) on your own server to keep
            update checks fully self-hosted; see docs/RELEASING.md.

            Linux: `_amd64` / `.x86_64` bundles are for x86_64, `_arm64` / `_aarch64` / `.aarch64`
            for 64-bit ARM (Raspberry Pi 4+, Apple Silicon VMs, Ampere and friends).

            Windows: `_x64` installers are for x86_64, `_arm64` for Windows on ARM
            (Snapdragon X, Surface Pro X and friends).

            macOS: `_aarch64.dmg` is for Apple Silicon, `_x64.dmg` for Intel. Unless this
            repository has a Developer ID configured, the builds are ad-hoc signed and not
            notarized: after dragging Termoso to Applications run
            `xattr -cr /Applications/Termoso.app` once (or right-click → Open) — see
            docs/RELEASING.md.

      - name: Verify AppImage contents
        if: runner.os == 'Linux'
        run: |
          for f in target/release/bundle/appimage/*.AppImage; do
            apps/desktop/src-tauri/appimage/verify.sh "$f"
          done

      - name: Upload bundles as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: termoso-desktop-${{ needs.version.outputs.version }}-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/*/release/bundle/msi/*.msi
            target/*/release/bundle/msi/*.msi.sig
            target/*/release/bundle/nsis/*.exe
            target/*/release/bundle/nsis/*.exe.sig
            target/*/release/bundle/dmg/*.dmg
            target/*/release/bundle/macos/*.app.tar.gz
            target/*/release/bundle/macos/*.app.tar.gz.sig

  android:
    name: android (signed APKs)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-release
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-ndk@4.1.2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Release keystore from secrets
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/termoso-release.jks"
          echo "TERMOSO_ANDROID_KEYSTORE=$RUNNER_TEMP/termoso-release.jks" >> "$GITHUB_ENV"

      # arm64 + armv7 for devices, x86_64 for emulators; one APK per ABI plus a universal one.
      # Without the keystore (manual / PR run) Gradle leaves the APKs unsigned.
      - name: Build
        run: |
          ./gradlew --no-daemon -Ptermoso.abis=arm64-v8a,armeabi-v7a,x86_64 -Ptermoso.splits=true :app:assembleRelease
          v=${{ needs.version.outputs.version }}
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            b=$(basename "$f" .apk)              # app-arm64-v8a-release[-unsigned]
            abi=${b#app-}; abi=${abi%-release*}
            cp "$f" "out/termoso-${v}-${abi}.apk"
          done
          ls -l out
        working-directory: apps/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          TERMOSO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TERMOSO_ANDROID_KEY_ALIAS: termoso

      - name: Verify signatures
        if: github.ref_type == 'tag'
        run: |
          for f in out/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$f" | grep -E 'Signer #1 certificate SHA-256'
          done
        working-directory: apps/android

      - uses: actions/upload-artifact@v7
        with:
          name: termoso-android-${{ needs.version.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: apps/android/out/*.apk

  # Unsigned device build. There is deliberately no Apple identity here: a
  # free Apple ID can only sign on the user's own device/Mac (7-day profile),
  # which AltStore/SideStore do from the source JSON published next to the .ipa.
  ios:
    name: ios (unsigned .ipa for sideloading)
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-release
      - run: brew install xcodegen
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Rust core (device, release) + Swift bindings + xcframework
        run: ./build-core.sh --release --device --no-sim
        working-directory: apps/ios
      - run: xcodegen generate
        working-directory: apps/ios
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive -project Termoso.xcodeproj -scheme Termoso -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Termoso.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            | tee "$RUNNER_TEMP/archive.log" | grep -E 'error:|warning:|\*\*' || true
          grep -q '\*\* ARCHIVE SUCCEEDED \*\*' "$RUNNER_TEMP/archive.log"
        working-directory: apps/ios
      - name: Package .ipa
        run: |
          v=${{ needs.version.outputs.version }}
          app="$RUNNER_TEMP/Termoso.xcarchive/Products/Applications/Termoso.app"
          test -d "$app" || { echo "::error::no Termoso.app in the archive"; ls -R "$RUNNER_TEMP/Termoso.xcarchive"; exit 1; }
          plutil -p "$app/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|MinimumOSVersion'
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "$v" ] || { echo "::error::app version differs from $v"; exit 1; }
          lipo -info "$app/Termoso" | grep -q arm64
          test -d "$app/Frameworks" && ls "$app/Frameworks" || echo "(no embedded frameworks: Rust core is statically linked)"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" out
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/apps/ios/out/termoso-$v-ios.ipa" Payload)
          ls -l out
          unzip -l "out/termoso-$v-ios.ipa" | tail -3
        working-directory: apps/ios
      - uses: actions/upload-artifact@v7
        with:
          name: termoso-ios-${{ needs.version.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: apps/ios/out/*.ipa

  publish:
    name: checksums, SBOM, attestations + publish
    if: github.ref_type == 'tag'
    needs: [version, bundle, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
      - name: Locate the draft release
        id: rel
        run: |
          id="${{ needs.version.outputs.release_id }}"
          [ -n "$id" ] || id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)
          [ -n "$id" ] || { echo "::error::no release for $GITHUB_REF_NAME"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: termoso-android-${{ needs.version.outputs.version }}
          path: android
      - uses: actions/download-artifact@v8
        with:
          name: termoso-ios-${{ needs.version.outputs.version }}
          path: ios
      - name: Upload APKs to the draft release
        run: |
          for f in android/*.apk; do
            gh api --method POST -H 'Content-Type: application/vnd.android.package-archive' \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}/assets?name=$(basename "$f")" \
              --input "$f" > /dev/null
          done
      # The AltStore/SideStore source is regenerated for every release and
      # always fetched through releases/latest/download/, so the URL users add
      # once stays valid (docs/IOS_SIDELOAD.md).
      - name: Upload .ipa + AltStore source to the draft release
        run: |
          v=${{ needs.version.outputs.version }}
          ipa=ios/termoso-$v-ios.ipa
          test -f "$ipa"
          python3 src/apps/ios/altstore/render.py \
            --template src/apps/ios/altstore/source.template.json \
            --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --version "$v" \
            --ipa "$ipa" --out termoso-altstore.json
          python3 -m json.tool termoso-altstore.json | head -40
          gh api --method POST -H 'Content-Type: application/octet-stream' \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}/assets?name=$(basename "$ipa")" \
            --input "$ipa" > /dev/null
          gh api --method POST -H 'Content-Type: application/json' \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}/assets?name=termoso-altstore.json" \
            --input termoso-altstore.json > /dev/null
      - name: Download and verify assets
        run: |
          mkdir assets && cd assets
          gh api "repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}/assets?per_page=100" \
            --jq '.[] | "\(.id) \(.name)"' > ../assets.txt
          while read -r aid name; do
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "$name"
          done < ../assets.txt
          ls -l
          test -f latest.json
          for f in *_amd64.deb *_arm64.deb *.x86_64.rpm *.aarch64.rpm *_amd64.AppImage *_aarch64.AppImage \
                   *.msi *.exe *.apk *_aarch64.dmg *_x64.dmg *_aarch64.app.tar.gz *_x64.app.tar.gz; do
            [ -e "$f" ] || { echo "::error::missing bundle $f"; exit 1; }
          done
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            [ -e "termoso-${{ needs.version.outputs.version }}-$abi.apk" ] || { echo "::error::missing APK for $abi"; exit 1; }
          done
          test -f "termoso-${{ needs.version.outputs.version }}-ios.ipa" || { echo "::error::missing iOS .ipa"; exit 1; }
          test -f termoso-altstore.json || { echo "::error::missing termoso-altstore.json"; exit 1; }
          jq -e --arg v "${{ needs.version.outputs.version }}" '.apps[0].versions[0] | select(.version == $v) | .downloadURL, .sha256' termoso-altstore.json
          [ "$(jq -r '.apps[0].versions[0].sha256' termoso-altstore.json)" = "$(sha256sum "termoso-${{ needs.version.outputs.version }}-ios.ipa" | cut -d' ' -f1)" ] || { echo "::error::altstore sha256 does not match the uploaded .ipa"; exit 1; }
          for f in *.AppImage *.msi *.exe *.app.tar.gz; do
            [ -e "$f.sig" ] || { echo "::error::missing signature for $f"; exit 1; }
          done
      # The five bundle jobs each read-modify-write latest.json through
      # tauri-action, so a concurrent upload can drop a platform. Rebuild the
      # manifest from the signed assets that actually made it to the release.
      - name: Rebuild latest.json from the uploaded assets
        run: |
          cd assets
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          platform_keys() {
            case "$1" in
              *_amd64.AppImage)     echo linux-x86_64 linux-x86_64-appimage ;;
              *_aarch64.AppImage)   echo linux-aarch64 linux-aarch64-appimage ;;
              *_amd64.deb)          echo linux-x86_64-deb ;;
              *_arm64.deb)          echo linux-aarch64-deb ;;
              *.x86_64.rpm)         echo linux-x86_64-rpm ;;
              *.aarch64.rpm)        echo linux-aarch64-rpm ;;
              *_x64-setup.exe)      echo windows-x86_64 windows-x86_64-nsis ;;
              *_x64_*.msi)          echo windows-x86_64-msi ;;
              *_arm64-setup.exe)    echo windows-aarch64 windows-aarch64-nsis ;;
              *_arm64_*.msi)        echo windows-aarch64-msi ;;
              *_aarch64.app.tar.gz) echo darwin-aarch64 darwin-aarch64-app ;;
              *_x64.app.tar.gz)     echo darwin-x86_64 darwin-x86_64-app ;;
            esac
          }
          jq '{version, notes, pub_date, platforms: {}}' latest.json > ../latest.json
          for sig in *.sig; do
            f=${sig%.sig}
            for key in $(platform_keys "$f"); do
              jq --arg k "$key" --arg url "$base/$f" --rawfile sig "$sig" \
                '.platforms[$k] = {signature: $sig, url: $url}' ../latest.json > ../latest.tmp
              mv ../latest.tmp ../latest.json
            done
          done
          for p in darwin-aarch64 darwin-x86_64 linux-x86_64 linux-aarch64 windows-x86_64 windows-aarch64; do
            jq -e --arg p "$p" '.platforms[$p].url' ../latest.json > /dev/null || { echo "::error::latest.json lacks $p"; exit 1; }
          done
          jq '.platforms | map_values(.url)' ../latest.json
          mv ../latest.json latest.json
          old=$(awk '$2 == "latest.json" {print $1}' ../assets.txt)
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          gh api --method POST -H 'Content-Type: application/json' \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}/assets?name=latest.json" \
            --input latest.json > /dev/null
      # Supply chain: an SBOM of the source tree (every Cargo, npm and Gradle
      # dependency the release was built from) in SPDX and CycloneDX, GitHub
      # build-provenance attestations for every asset, and a keyless cosign
      # signature over SHA256SUMS.txt. SECURITY.md explains how to verify.
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: src
          format: spdx-json
          output-file: assets/termoso-${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: src
          format: cyclonedx-json
          output-file: assets/termoso-${{ needs.version.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOMs
        run: |
          cd assets
          for f in *.spdx.json *.cdx.json; do
            gh api --method POST -H 'Content-Type: application/json' \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}/assets?name=$f" \
              --input "$f" > /dev/null
          done
      - name: Write SHA256SUMS
        run: |
          cd assets
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh api --method POST -H 'Content-Type: text/plain' \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}/assets?name=SHA256SUMS.txt" \
            --input SHA256SUMS.txt > /dev/null
      - uses: sigstore/cosign-installer@v3
      - name: Sign SHA256SUMS (cosign keyless)
        run: |
          cd assets
          cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt
          gh api --method POST -H 'Content-Type: application/json' \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}/assets?name=SHA256SUMS.txt.sigstore.json" \
            --input SHA256SUMS.txt.sigstore.json > /dev/null
      - name: Build provenance attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            assets/*
            !assets/*.sig
            !assets/*.sigstore.json
            !assets/latest.json
            !assets/termoso-altstore.json
      - name: Publish
        run: |
          case "$GITHUB_REF_NAME" in *-*) latest=false ;; *) latest=true ;; esac
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/${{ steps.rel.outputs.id }}" \
            -F draft=false -f make_latest=$latest > /dev/null
          echo "published https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"

  # Package channels: the apt/dnf repositories served from termoso/termoso-repo
  # (GitHub Pages), the Homebrew tap termoso/homebrew-termoso and the winget
  # manifest in microsoft/winget-pkgs. Stable tags only; pre-releases stay on
  # the releases page. Pushes to the two side repositories use write-only
  # deploy keys, so this job never needs a token for the main repository.
  distribute:
    name: apt/dnf repo, Homebrew tap, winget
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    needs: [version, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/repo
          path: src
      - name: Download the published bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D assets \
            -p '*.deb' -p '*.rpm' -p 'SHA256SUMS.txt'
          ls -l assets
      - name: Install repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends createrepo-c rpm apt-utils
      - name: Import the repository signing key
        run: |
          printf '%s\n' "${{ secrets.TERMOSO_REPO_GPG_KEY }}" | gpg --batch --quiet --import
          gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="fpr"{print $10; exit}' > keyid
          test -s keyid
      - name: Check out termoso-repo
        uses: actions/checkout@v7
        with:
          repository: termoso/termoso-repo
          ssh-key: ${{ secrets.TERMOSO_REPO_DEPLOY_KEY }}
          path: repo
      - name: Rebuild the apt + dnf repositories
        run: |
          src/scripts/repo/build.sh assets repo "$VERSION" "$(cat keyid)"
          cd repo
          git config user.name "Termoso release"
          git config user.email "packages@termoso.dev"
          git add -A
          git commit -q -m "Termoso $VERSION"
          git push -q
      - name: Check out the Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: termoso/homebrew-termoso
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Update the cask
        run: |
          mkdir -p tap/Casks
          src/scripts/repo/cask.sh assets/SHA256SUMS.txt "$VERSION" > tap/Casks/termoso.rb
          cd tap
          git config user.name "Termoso release"
          git config user.email "packages@termoso.dev"
          git add -A
          git commit -q -m "termoso $VERSION" || echo "cask unchanged"
          git push -q
      # Opens the version-bump PR in microsoft/winget-pkgs from a fork owned by
      # the token's account (WINGET_TOKEN needs public_repo). The first
      # submission of a new package is manual (`komac new`), so this only runs
      # once the package exists upstream. Failures here must not fail the release.
      - name: Submit the winget update
        if: env.WINGET_TOKEN != ''
        continue-on-error: true
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          curl -fsSL -o komac.tgz https://github.com/russellbanks/Komac/releases/download/v2.17.1/komac-2.17.1-x86_64-unknown-linux-gnu.tar.gz
          tar xzf komac.tgz
          ./komac update Termoso.Termoso --version "$VERSION" --submit --token "$WINGET_TOKEN" \
            --urls "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Termoso_${VERSION}_x64_en-US.msi"
