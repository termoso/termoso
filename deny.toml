# cargo-deny policy for the Termoso workspace.
#
#   cargo deny check advisories   # RustSEC advisories against Cargo.lock
#   cargo deny check licenses     # every dependency licence is on the allow list
#   cargo deny check bans         # no denied crates / wildcard deps
#   cargo deny check sources      # dependencies come from crates.io only
#
# `ignore` entries below carry the reason they were accepted; drop them as soon
# as the upstream fix ships.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # RSA "Marvin" timing side channel (private-key operations). No fixed release
  # exists (0.10 is still an rc with the same status). termoso-server performs
  # no private-key operation with this crate: the SAML SP key (signing
  # AuthnRequests, unwrapping EncryptedAssertion key transport — the one
  # remotely drivable private-key path, via the ACS) runs in AWS-LC
  # (crates/termoso-awslc-rsa + aws-lc-rs, constant-time RSA); rsa 0.9 there
  # only parses PEM/DER and verifies IdP signatures with public keys, and
  # openidconnect only verifies RS256 signatures. Residual private-key use:
  # russh signs one SSH userauth challenge per connection with an RSA client
  # key, on the user's own device (timing not observable remotely at the
  # required precision; Ed25519 is the default key type). Re-evaluate when a
  # fixed rsa release exists.
  { id = "RUSTSEC-2023-0071", reason = "no upstream fix; server does public-key ops only (SAML private ops run in AWS-LC); residual: local SSH RSA userauth signing in russh" },
  # Unmaintained transitive crates without a known vulnerability: pulled in by
  # Tauri/tera/gtk tooling, not by Termoso code.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via tauri build tooling; compile-time only" },
  { id = "RUSTSEC-2025-0075", reason = "unic-* via tera (uniffi-bindgen templates); compile-time only" },
  { id = "RUSTSEC-2025-0080", reason = "unic-* via tera (uniffi-bindgen templates); compile-time only" },
  { id = "RUSTSEC-2025-0081", reason = "unic-* via tera (uniffi-bindgen templates); compile-time only" },
  { id = "RUSTSEC-2025-0098", reason = "unic-* via tera (uniffi-bindgen templates); compile-time only" },
  { id = "RUSTSEC-2025-0100", reason = "unic-* via tera (uniffi-bindgen templates); compile-time only" },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml via askama_derive (uniffi-bindgen templates); compile-time only, parses our own templates" },
  # crypto-bigint 0.5 timing variability. Fixed only in the 0.7 line (0.7.6, which
  # we use for russh/rsa); aws-sigv4 and elliptic-curve 0.13 still pin 0.5 and no
  # 0.5.x fix exists. On the server 0.5 only signs S3 requests (SigV4 is HMAC, the
  # bigint is a hashing helper, no secret-dependent arithmetic); on clients it
  # backs ECDSA host-key verification (public-key ops). Drop when aws-sigv4 /
  # elliptic-curve move to 0.7.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 pinned by aws-sigv4 + elliptic-curve 0.13; no 0.5 fix; no secret-dependent use on our paths" },
  # zip < 9 extract(): symlink escape / SUID bits / permissions through
  # symlinks. No fixed release reachable: utoipa-swagger-ui 9 and 10 pin
  # zip 3 / 8 as a *build* dependency (it unpacks the vendored Swagger UI
  # dist at compile time; nothing at runtime), and every tauri-plugin-updater
  # release still pins zip 4 — there it unpacks an update bundle only after
  # the bundle's minisign signature verified against the key compiled into
  # the app, so the archive is never attacker-controlled. Drop when
  # utoipa-swagger-ui / tauri-plugin-updater move to zip 9.
  { id = "RUSTSEC-2026-0367", reason = "zip extract via utoipa-swagger-ui build.rs (compile-time) and tauri-plugin-updater (signature-verified bundles only)" },
  { id = "RUSTSEC-2026-0368", reason = "zip extract via utoipa-swagger-ui build.rs (compile-time) and tauri-plugin-updater (signature-verified bundles only)" },
  { id = "RUSTSEC-2026-0369", reason = "zip extract via utoipa-swagger-ui build.rs (compile-time) and tauri-plugin-updater (signature-verified bundles only)" },
  # Bundled SQLite < 3.54 (CVE-2026-119375): uninitialized page-cache bytes when a
  # database is opened together with an attacker-written -wal of another page size.
  # The vault database lives in the app's private data dir; no untrusted
  # database files are opened. The fix (libsqlite3-sys 0.39 via rusqlite 0.41)
  # is blocked by sqlx 0.9.0, which pins libsqlite3-sys < 0.38 (links = sqlite3).
  # Drop when sqlx allows libsqlite3-sys 0.39.
  { id = "RUSTSEC-2026-0459", reason = "bundled SQLite CVE-2026-119375 needs a hostile -wal next to the vault db in the app's private dir; blocked on sqlx 0.9 pinning libsqlite3-sys < 0.38" },
  # zbus_names / zvariant / zvariant_derive were folded into zbus 6; no
  # vulnerability, just "unmaintained as standalone crates". They reach us only
  # through zbus 5 on Linux desktop: notify-rust (tauri-plugin-notification) and
  # secret-service (keyring). Drop once those move to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5 (notify-rust, secret-service); Linux desktop only, no vulnerability" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5 (notify-rust, secret-service); Linux desktop only, no vulnerability" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5 (notify-rust, secret-service); Linux desktop only, no vulnerability" },
]

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

# Workspace crates are AGPL-3.0-only and publish = false.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # TLS goes through rustls everywhere (openssl is only linked by webauthn-rs
  # for attestation certificate parsing, never as a TLS backend).
  { crate = "native-tls", reason = "rustls only" },
  { crate = "hyper-tls", reason = "rustls only" },
  # Legacy hyper 0.14 / rustls 0.21 line (unpatched rustls-webpki 0.101 and h2 0.3).
  { crate = "rustls@^0.21", reason = "rustls-webpki 0.101 has open advisories; use the hyper 1.x client features" },
  { crate = "h2@^0.3", reason = "h2 0.3 has open advisories; use the hyper 1.x client features" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
